# Project configuration for Wails v3.
# After changing `info`, regenerate the platform files in build/ (Info.plist, NSIS, .desktop, …):
#   wails3 task common:update:build-assets
# Note: this overwrites manual edits in the generated files.
version: '3'

info:
  companyName: "Ka55elino"
  productName: "DnD Builder" # no "&" in any info field: it goes into XML (Info.plist, manifests) unescaped
  productIdentifier: "com.ka55elino.dndbuilder"
  description: "DnD 2024 character builder"
  copyright: "(c) 2026, Ka55elino"
  comments: "Character builder for Dungeons and Dragons 2024"
  version: "0.3.0" # keep equal to APP_VERSION in constants.go (CI checks the tag against it)

# iOS build configuration (keys here override `info` for the iOS project)
# ios:
#   bundleID: "com.ka55elino.dndbuilder"
#   displayName: "DnD Builder"
#   version: "0.3.0"
#   company: "Ka55elino"

# Dev mode (`wails3 dev`): rebuilds and restarts the app when Go files change
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend # Vite reloads the frontend itself
      - bin
      - tools
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.json" # assets/data is embedded: a data change needs a rebuild
      - "*.sql"  # db/schema, db/queries (embedded)
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown

fileAssociations:

other:
  - name: dnd-builder-v3
