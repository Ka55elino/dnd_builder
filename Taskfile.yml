version: '3'

# Wails v3 build orchestration (https://taskfile.dev). Run tasks with `wails3 task <name>`,
# `wails3 task --list` shows them all. Platform tasks live in build/<platform>/Taskfile.yml.

vars:
  APP_NAME: "dnd-builder-v3"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run: the host OS unless `wails3 build GOOS=...` (or the GOOS env var) is set.
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  ios: ./build/ios/Taskfile.yml
  android: ./build/android/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  version:
    summary: Shows the app version and checks every file carries it (APP_VERSION in constants.go is the source)
    cmds:
      - go run ./tools/version

  version:set:
    summary: "Sets the app version everywhere: wails3 task version:set VERSION=0.3.1"
    requires:
      vars: [VERSION]
    cmds:
      - go run ./tools/version {{.VERSION}}

  version:sync:
    summary: Copies APP_VERSION from constants.go to build/config.yml and the platform files in build/
    cmds:
      - go run ./tools/version -sync

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}
